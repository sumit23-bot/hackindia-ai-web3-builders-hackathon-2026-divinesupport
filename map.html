<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLoop - Live Radar Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: #111827;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #334155;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #000000;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            color: #ffffff;
        }

        /* Map Container */
        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
        }

        /* Controls / Floating Panels */
        .floating-panel {
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 18px;
            z-index: 999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .legend-panel {
            top: 16px;
            right: 16px;
            max-width: 280px;
        }

        .legend-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .legend-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .gps-status-panel {
            bottom: 24px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .recenter-btn {
            position: absolute;
            bottom: 24px;
            right: 20px;
            background-color: var(--primary);
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .recenter-btn:hover {
            background-color: var(--primary-dark);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Leaflet Popup Custom Styling */
        .leaflet-popup-content-wrapper {
            background: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #475569 !important;
            border-radius: 10px !important;
            padding: 6px !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6) !important;
        }

        .leaflet-popup-tip {
            background: #1e293b !important;
        }

        .popup-content {
            font-size: 13px;
            line-height: 1.4;
        }

        .popup-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .popup-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .popup-badge-food {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .popup-badge-ngo {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .popup-badge-animal {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            🍲 Food<span>Loop</span>
        </a>
        <div class="header-actions">
            <a href="index.html" class="btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Main App
            </a>
            <button class="btn btn-primary" onclick="locateAndCenterUser(true)">
                <i class="fa-solid fa-location-crosshairs"></i> Refresh Live GPS
            </button>
        </div>
    </header>

    <div id="map-container">
        <div id="map"></div>

        <!-- Legend Panel -->
        <div class="floating-panel legend-panel">
            <div class="legend-title">Active 10km Grid</div>
            <div class="legend-item">
                <span class="legend-icon">📍</span>
                <span><strong>Your Location</strong> (Center)</span>
            </div>
            <div class="legend-item">
                <span class="legend-icon">🍲</span>
                <span>Surplus Food Donation</span>
            </div>
            <div class="legend-item">
                <span class="legend-icon">🏛️</span>
                <span>Verified NGO Shelter</span>
            </div>
            <div class="legend-item">
                <span class="legend-icon">🐾</span>
                <span>AWBI Gaushala / Animal Loop</span>
            </div>
            <div class="legend-item">
                <span class="legend-icon">⚡</span>
                <span>Bio-CNG Energy Plant</span>
            </div>
        </div>

        <!-- GPS Status Bar -->
        <div class="floating-panel gps-status-panel">
            <div class="status-dot"></div>
            <span id="gps-status-text" style="font-size: 13px; font-weight: 600;">Scanning GPS Sensor...</span>
        </div>

        <!-- Recenter Button -->
        <button class="recenter-btn" onclick="locateAndCenterUser(true)">
            <i class="fa-solid fa-location-arrow"></i> Target My Location
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Map Logic Script -->
    <script src="map.js"></script>
</body>
</html>
